<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script type="module">
      // Backend (repo / branch / OAuth proxy) is injected from the single
      // per-fork config file so the admin needn't be edited when forking.
      // Loaded base-relative so it resolves in dev (/admin/) and prod
      // (/<base>/admin/) alike. The rest of the config (collections,
      // local_backend, media folders) still comes from config.yml; CMS.init
      // merges what we pass over it — arrays are concatenated, so we append
      // the language-gated "Get the Atlas in your language" collection only on
      // the English fork (deployConfig.lang === 'en') rather than shipping it
      // in config.yml. Every other fork links the footer straight to the
      // external languageVersionsUrl instead.
      const { deployConfig } = await import(
        new URL('../deploy.config.js', document.baseURI).href
      );

      const languageCollection = {
        name: 'language',
        label: 'Get the Atlas in your language',
        files: [
          {
            name: 'language',
            label: 'Get the Atlas in your language',
            file: 'src/content/language/language.md',
            description:
              'Content shown on the "Get the Atlas in your language" page (English site only).',
            fields: [
              { label: 'Title', name: 'title', widget: 'string' },
              {
                label: 'Meta description',
                name: 'description',
                widget: 'text',
                required: false,
                hint: 'Shown in search results and social previews. Falls back to the site default (Settings → SEO) if left blank.',
              },
              { label: 'Body', name: 'body', widget: 'markdown' },
            ],
          },
        ],
      };

      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: deployConfig.cms.repo,
            branch: deployConfig.cms.branch,
            base_url: deployConfig.cms.oauthBaseUrl,
            auth_endpoint: '/auth',
          },
          ...((deployConfig.lang || 'en') === 'en'
            ? { collections: [languageCollection] }
            : {}),
        },
      });
    </script>
    <script>
      // Block removing a chapter (Settings → Chapters) that still has infographics
      // linked to it — otherwise those infographics would drop out of the feed
      // silently. Usage comes from the /chapters-usage.json build endpoint.
      CMS.registerEventListener({
        name: 'preSave',
        handler: async ({ entry }) => {
          const data = entry.get('data');
          const chapters = data && data.get && data.get('chapters');
          // Only the Chapters settings file has a `chapters` list; ignore others.
          if (!chapters || typeof chapters.toJS !== 'function') return data;

          const keptIds = chapters
            .toJS()
            .map((c) => c && c.id)
            .filter(Boolean);

          let usage;
          try {
            const url = new URL('../chapters-usage.json', document.baseURI).href;
            const res = await fetch(url, { cache: 'no-store' });
            if (!res.ok) return data; // manifest missing — don't block editing
            usage = await res.json();
          } catch {
            return data; // offline / not built yet — don't block editing
          }

          const orphaned = usage.filter((u) => !keptIds.includes(u.id));
          if (orphaned.length) {
            const list = orphaned
              .map(
                (u) =>
                  `“${u.name}” (${u.count} infographic${u.count === 1 ? '' : 's'})`
              )
              .join(', ');
            throw new Error(
              `Can't remove a chapter that still has infographics: ${list}. ` +
                `Reassign those infographics to another chapter first.`
            );
          }
          return data;
        },
      });
    </script>
  </body>
</html>
