backend:
  name: github
  repo: hiiampadik/AtlasOfClimateChange
  branch: master
  base_url: https://decap-oauth.brona-musil.workers.dev
  auth_endpoint: /auth

local_backend: true

media_folder: "public/images/atlas"
public_folder: "/images/atlas"

collections:
  - name: "infographics"
    label: "Infographics"
    label_singular: "Infographic"
    folder: "src/content/infographics"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}}  ·  {{chapter}}"
    sortable_fields: ["order", "chapter", "title"]
    view_groups:
      - label: "Chapter"
        field: "chapter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Lead", name: "lead", widget: "text", hint: "Short intro shown in the feed and above the chart." }
      - label: "Chapter"
        name: "chapter"
        widget: "select"
        options:
          - { label: "Introduction", value: "introduction" }
          - { label: "The Science", value: "the-science" }
          - { label: "The Impacts", value: "the-impacts" }
          - { label: "The Trajectory", value: "the-trajectory" }
          - { label: "The Solutions", value: "the-solutions" }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 1, hint: "Position within the chapter." }
      - label: "Graphic"
        name: "image"
        widget: "image"
        hint: "The infographic image. Also offered as a PNG download."
      - label: "Downloads"
        name: "downloads"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "PDF", name: "pdf", widget: "file", required: false }
      - label: "Underlying data"
        name: "data"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Data table URL", name: "tableUrl", widget: "string", required: false }
          - { label: "Data source URL", name: "sourceUrl", widget: "string", required: false }
          - { label: "Source citation", name: "citation", widget: "string", required: false, hint: "e.g. NASA Goddard Institute for Space Studies" }
      - label: "Related infographics"
        name: "related"
        widget: "list"
        required: false
        summary: "{{fields.slug}}"
        hint: "Shown in the \"More articles\" box on this infographic's detail page. Leave empty to automatically show the next 2 infographics."
        field:
          label: "Infographic"
          name: "slug"
          widget: "relation"
          collection: "infographics"
          search_fields: ["title"]
          value_field: "{{slug}}"
          display_fields: ["title"]
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "about"
    label: "About Page"
    files:
      - name: "about"
        label: "About Page"
        file: "src/content/about/about.md"
        description: "Content shown on the About page."
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Settings"
    files:
      - name: "navigation"
        label: "Navigation, Languages & Footer"
        file: "src/data/site.json"
        description: "External links (About page sidebar), language switcher, and footer content."
        fields:
          - label: "External links"
            name: "menuLinks"
            label_singular: "External link"
            widget: "list"
            hint: "Shown in the \"External links\" box on the About page's sidebar."
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - label: "Language versions"
            name: "languages"
            label_singular: "Language"
            widget: "list"
            summary: "{{fields.code}}"
            fields:
              - { label: "Code", name: "code", widget: "string", hint: "Shown in the switcher, e.g. EN" }
              - { label: "Flag emoji", name: "flag", widget: "string", required: false }
              - { label: "URL", name: "url", widget: "string", hint: "Link to that language's site" }
          - label: "Social links"
            name: "socialLinks"
            label_singular: "Social link"
            widget: "list"
            summary: "{{fields.label}}"
            hint: "Shown as icon links in the footer."
            fields:
              - { label: "Name", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - label: "Icon (SVG)"
                name: "icon"
                widget: "image"
                media_folder: "public/images/social"
                public_folder: "/images/social"
          - label: "Atlas PDF"
            name: "atlasPdfUrl"
            widget: "file"
            required: false
            hint: "Shown as a \"Download PDF\" button in the footer, next to the Atlas title."
          - label: "Get the Atlas in your language — URL"
            name: "languageVersionsUrl"
            widget: "string"
            required: false
            hint: "Shown as a link below the language switcher in the footer."
          - label: "Footer legal text"
            name: "footerLegal"
            widget: "text"
            hint: "Copyright, license, and contact info — shown as a single paragraph in the footer."

      - name: "chapters"
        label: "Chapters"
        file: "src/data/chapters.json"
        description: "Section titles and taglines shown in the feed. Translate the name and tagline; keep the ID unchanged."
        fields:
          - label: "Chapters"
            name: "chapters"
            label_singular: "Chapter"
            widget: "list"
            summary: "{{fields.name}}  ·  {{fields.tagline}}"
            fields:
              - { label: "ID", name: "id", widget: "string", hint: "Join key with infographics — keep stable, do not translate." }
              - { label: "Name", name: "name", widget: "string", hint: "Bold section name, e.g. Introduction." }
              - { label: "Tagline", name: "tagline", widget: "string", hint: "Descriptive tagline, e.g. The Big Picture." }
              - { label: "Order", name: "order", widget: "number", value_type: "int", default: 1 }
